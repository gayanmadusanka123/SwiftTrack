services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: swifttrack-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: password
      MSSQL_PID: Developer

    ports:
      - "14330:1433"

    volumes:
      - swifttrack_sql_data:/var/opt/mssql

    restart: unless-stopped

volumes:
  swifttrack_sql_data: